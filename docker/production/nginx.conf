# HTTP server - redirects everything to HTTPS
server {
	listen 80 default_server;
	listen [::]:80 default_server;

	server_name _;

	return 301 https://$host$request_uri;
}

# HTTPS server
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;

	server_name secvisogram.de;

	# Certificates obtained on the host (e.g. via certbot) and bind-mounted
	# into the container, see docker-compose.yml
	ssl_certificate /etc/letsencrypt/secvisogram.de/cert.pem;
	ssl_certificate_key /etc/letsencrypt/secvisogram.de/key.pem;
	ssl_trusted_certificate /etc/letsencrypt/secvisogram.de/ca.pem;
	ssl_dhparam /etc/nginx/dhparams/dhparams.pem;

	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers 'TLS-CHACHA20-POLY1305-SHA256:TLS-AES-256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384';
	ssl_ecdh_curve secp521r1:secp384r1;
	ssl_prefer_server_ciphers on;

	ssl_stapling on;
	ssl_stapling_verify on;
	resolver 8.8.8.8 8.8.4.4;

	ssl_session_timeout 24h;
	ssl_session_cache shared:SSL:50m;
	ssl_session_tickets off;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff;
	add_header X-Frame-Options DENY;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' https: blob: ; style-src 'self' 'unsafe-inline' unpkg.com; img-src 'self' https: data: blob: ; media-src 'none'; connect-src 'self'; ";
	add_header Referrer-Policy no-referrer;
	add_header Permissions-Policy "geolocation=(), camera=(), fullscreen=*, usb=(), payment=(), microphone=(), gyroscope=(), accelerometer=()";

	root /usr/share/nginx/html;
	index index.html;

	location / {
		try_files $uri $uri/ =404;
	}

	# Delegates to the csaf-validator-service container on the compose network
	location /validator/ {
		proxy_pass http://validator:8082/;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
