# Secvisogram Dependabot configuration file

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/app'
    schedule:
      interval: 'daily'
    open-pull-requests-limit: 5
    allow:
      - dependency-type: 'production'
    groups:
      npm-dependencies:
        patterns:
          - '*'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
    groups:
      docker-images:
        patterns:
          - '*'
